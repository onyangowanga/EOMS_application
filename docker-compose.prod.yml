version: "3.9"

services:
  # =========================
  # PostgreSQL
  # =========================
  db:
    image: postgres:16-alpine
    container_name: eoms-postgres
    restart: always
    env_file:
      - ./db/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eoms}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # =========================
  # Redis
  # =========================
  redis:
    image: redis:alpine
    container_name: eoms-redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================
  # Backend (Django + Gunicorn)
  # =========================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: eoms-backend
    command: gunicorn eoms_api.wsgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-2} --timeout 300
    env_file:
      - ./backend/.env
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  # =========================
  # Celery Worker
  # =========================
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: eoms-celery
    command: celery -A eoms_api worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-1}
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
      - backend
    restart: always

  # =========================
  # Celery Beat (Scheduler)
  # =========================
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: eoms-celery-beat
    command: celery -A eoms_api beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
      - backend
    restart: always

  # =========================
  # Frontend (React build served by Nginx)
  # =========================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: eoms-frontend
    restart: always

  # =========================
  # Reverse Proxy (NGINX)
  # =========================
  nginx:
    image: nginx:latest
    container_name: eoms-nginx
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - static_files:/var/www/static
      - media_files:/var/www/media
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    restart: always

volumes:
  postgres_data:
  media_files:
  static_files:

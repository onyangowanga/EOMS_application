# Production Docker Compose Configuration
# Use this for production deployment with Nginx serving static files

services:
  db:
    image: postgres:16-alpine
    container_name: eoms_db
    environment:
      POSTGRES_DB: ${DB_NAME:-eoms}
      POSTGRES_USER: ${DB_USER:-eoms}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-eoms}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eoms_network

  redis:
    image: redis:7-alpine
    container_name: eoms_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eoms_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eoms_backend
    command: gunicorn eoms_api.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 300
    volumes:
      - media_files:/app/media
      - static_files:/app/static
    expose:
      - "8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DB_NAME=${DB_NAME:-eoms}
      - DB_USER=${DB_USER:-eoms}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - eoms_network

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eoms_celery
    command: celery -A eoms_api worker --loglevel=info --concurrency=4
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DB_NAME=${DB_NAME:-eoms}
      - DB_USER=${DB_USER:-eoms}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
      - backend
    restart: unless-stopped
    networks:
      - eoms_network

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eoms_celery_beat
    command: celery -A eoms_api beat --loglevel=info
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DB_NAME=${DB_NAME:-eoms}
      - DB_USER=${DB_USER:-eoms}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
      - backend
    restart: unless-stopped
    networks:
      - eoms_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
    container_name: eoms_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - eoms_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  postgres_data:
  media_files:
  static_files:

networks:
  eoms_network:
    driver: bridge

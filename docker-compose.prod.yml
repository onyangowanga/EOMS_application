# Production Docker Compose Configuration
# Use this for production deployment with Nginx serving static files

services:
  db:
    image: postgres:16-alpine
    container_name: eoms_db
    environment:
      POSTGRES_DB: ${DB_NAME:-eoms}
      POSTGRES_USER: ${DB_USER:-eoms}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-eoms}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eoms_network

  redis:
    image: redis:7-alpine
    container_name: eoms_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eoms_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: eoms_backend
    command: gunicorn eoms_api.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 300
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
    ports:
      - "8001:8000"  # Different port from COMS
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DB_NAME=${DB_NAME:-eoms}
      - DB_USER=${DB_USER:-eoms}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - AFRICAS_TALKING_USERNAME=${AFRICAS_TALKING_USERNAME}
      - AFRICAS_TALKING_API_KEY=${AFRICAS_TALKING_API_KEY}
      - AFRICAS_TALKING_SENDER_ID=${AFRICAS_TALKING_SENDER_ID}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - eoms_network

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: eoms_celery
    command: celery -A eoms_api worker --loglevel=info --concurrency=4
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DB_NAME=${DB_NAME:-eoms}
      - DB_USER=${DB_USER:-eoms}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - AFRICAS_TALKING_USERNAME=${AFRICAS_TALKING_USERNAME}
      - AFRICAS_TALKING_API_KEY=${AFRICAS_TALKING_API_KEY}
      - AFRICAS_TALKING_SENDER_ID=${AFRICAS_TALKING_SENDER_ID}
    depends_on:
      - db
      - redis
      - backend
    restart: unless-stopped
    networks:
      - eoms_network

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: eoms_celery_beat
    command: celery -A eoms_api beat --loglevel=info
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DB_NAME=${DB_NAME:-eoms}
      - DB_USER=${DB_USER:-eoms}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - AFRICAS_TALKING_USERNAME=${AFRICAS_TALKING_USERNAME}
      - AFRICAS_TALKING_API_KEY=${AFRICAS_TALKING_API_KEY}
      - AFRICAS_TALKING_SENDER_ID=${AFRICAS_TALKING_SENDER_ID}
    depends_on:
      - db
      - redis
      - backend
    restart: unless-stopped
    networks:
      - eoms_network

  # Frontend is served via Nginx on VPS, not as a container
  # Nginx configuration is handled by deploy_frontend_to_vps.ps1 script

volumes:
  postgres_data:
  media_files:
  static_files:

networks:
  eoms_network:
    driver: bridge
